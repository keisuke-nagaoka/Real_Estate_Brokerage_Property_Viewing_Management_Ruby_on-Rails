# EC2上で使う本番構成。ローカルのcompose.ymlと違い、MySQLコンテナは持たず
# apps/naiken/backend/.env.production の DB_HOST でRDSを指す。
# 使い方: docker compose -f compose.prod.yml up -d --build
services:
  nginx:
    container_name: rails_nginx
    # 開発用(compose.yml)のイメージと名前が衝突しないよう、本番用は明示的にタグを付ける
    image: rails-nginx:prod
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./docker/nginx/server.key:/etc/nginx/ssl/server.key:ro
    depends_on:
      naiken-api:
        condition: service_healthy
    restart: unless-stopped

  naiken-api:
    container_name: naiken-api
    image: naiken-api:prod
    build:
      context: .
      dockerfile: docker/ruby/Dockerfile.prod
      args:
        APP_DIR: apps/naiken/backend
    env_file:
      - ./apps/naiken/backend/.env.production
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
