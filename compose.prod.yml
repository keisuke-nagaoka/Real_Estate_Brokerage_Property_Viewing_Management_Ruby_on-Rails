# 本番構成を手元で確認するための設定。
# EC2 では、この内容と同じ docker build / docker run を手順書(docs/infrastructure.md)どおりに実行する。
# - DBは Amazon RDS for MySQL(apps/naiken/backend/.env.production の DB_HOST)
# - HTTPS は既存の入口のnginx(コンテナ名「nginx」)が受け、web-network 経由で naiken-nginx に転送する
#
# 使い方(手元): docker network create web-network(初回のみ) → docker compose -f compose.prod.yml up -d --build
services:
  naiken-nginx:
    image: naiken-nginx:latest
    container_name: naiken-nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    # 入口のnginxを通さずに動作確認できるよう、サーバー内(127.0.0.1)からだけ接続できるポートを開ける
    ports:
      - "127.0.0.1:${NAIKEN_PORT:-8300}:80"
    networks:
      - default
      - front
    depends_on:
      naiken-api:
        condition: service_healthy
    restart: unless-stopped

  naiken-api:
    image: naiken-api:latest
    container_name: naiken-api
    build:
      context: .
      dockerfile: docker/ruby/Dockerfile.prod
      args:
        APP_DIR: apps/naiken/backend
    env_file:
      - ./apps/naiken/backend/.env.production
    # 物件写真(Active Storage)の保存先。コンテナを作り直しても消えないようボリュームに置く
    volumes:
      - naiken_storage:/rails/storage
    # Rails API は入口のnginxから直接は見えないようにし、naiken-nginx 経由でのみ受け付ける
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

networks:
  # 既存の入口のnginx・他のアプリ(node・go)が参加しているネットワーク
  front:
    name: ${FRONT_NETWORK:-web-network}
    external: true

volumes:
  naiken_storage:
