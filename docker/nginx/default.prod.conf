# 本番(rails.keisuke-nagaoka.com)用。アプリごとのupstreamを追加して、パス単位で振り分ける
upstream naiken_api {
    server naiken-api:3000;
}

server {
    listen 80;
    server_name rails.keisuke-nagaoka.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name rails.keisuke-nagaoka.com;

    # 自己署名証明書ではなく、Let's Encrypt等の正式な証明書に差し替える
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        return 302 /naiken/;
    }

    location = /naiken {
        return 301 /naiken/;
    }

    # API: /naiken/api/xxx → Rails の /api/xxx
    location /naiken/api/ {
        proxy_pass http://naiken_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ハッシュ付きファイル名のビルド成果物は長期キャッシュする
    location /naiken/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 画面: Reactのビルド成果物。クライアントサイドルーティングのため未知のパスは index.html を返す
    location /naiken/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /naiken/index.html;
        add_header Cache-Control "no-cache";
    }
}
