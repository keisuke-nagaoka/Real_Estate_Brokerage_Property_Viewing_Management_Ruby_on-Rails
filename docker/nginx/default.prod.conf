# 本番(rails.keisuke-nagaoka.com)用。
# EC2では既存の入口のnginx(Dockerコンテナ「nginx」)がHTTPS(Let's Encrypt)を受け、
# web-network 経由でこのコンテナの80番に転送する。そのため、ここではHTTPS・リダイレクトは扱わない。

# /naiken/api/xxx → /api/xxx。日本語のファイル名などを含むURLが崩れないよう、
# エンコードされたままのURI(クエリ文字列を含む)から先頭の /naiken を取り除く
map $request_uri $naiken_api_uri {
    ~^/naiken(?<api_path>/api/.*)$ $api_path;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    # リダイレクト先を相対パスにして、入口のnginxのスキーム(https)・ホストをそのまま使う
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        return 302 /naiken/;
    }

    location = /naiken {
        return 301 /naiken/;
    }

    # Rails API のコンテナ(naiken-api)は、リクエストのたびにDockerのDNS(127.0.0.11)で引く。
    # デプロイでコンテナを作り直してIPアドレスが変わっても、このnginxを再起動せずに済む
    resolver 127.0.0.11 valid=30s ipv6=off;

    # API: /naiken/api/xxx → Rails の /api/xxx
    location /naiken/api/ {
        # 物件写真のアップロード(1枚5MB × 最大10枚)を受け付ける
        client_max_body_size 50m;
        proxy_pass http://naiken-api:3000$naiken_api_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 入口のnginxから受け取ったスキーム(https)をそのまま伝える
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # location の中で add_header を使うと上のセキュリティヘッダーが引き継がれなくなるため、
    # キャッシュの指定は expires で行う

    # ハッシュ付きファイル名のビルド成果物は長期キャッシュする
    location /naiken/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
    }

    # 画面: Reactのビルド成果物。クライアントサイドルーティングのため未知のパスは index.html を返す。
    # index.html は毎回確認させ、デプロイ後すぐに新しい画面が表示されるようにする
    location /naiken/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /naiken/index.html;
        expires -1;
    }
}
