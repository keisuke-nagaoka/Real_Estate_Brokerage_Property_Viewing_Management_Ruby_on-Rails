# アプリごとのupstream。新しいアプリを追加したらここに追記する
upstream naiken_api {
    server naiken-api:3000;
}
upstream naiken_web {
    server naiken-web:5173;
}

# ViteのHMR(WebSocket)をnginx経由で通すための設定
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 443 ssl;
    server_name localhost;
    # リダイレクト時にホスト側のポート(9300/9743)が落ちないよう相対パスで返す
    absolute_redirect off;
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # 末尾スラッシュなしでアクセスされた場合はリダイレクトして統一する
    location = /naiken {
        return 301 /naiken/;
    }

    # API: /naiken/api/xxx → Rails の /api/xxx
    location /naiken/api/ {
        # 物件写真のアップロード(1枚5MB × 最大10枚)を受け付ける(nginxの既定値は1MB)
        client_max_body_size 50m;
        proxy_pass http://naiken_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 画面: Viteの開発サーバー(base: /naiken/)へパスを変えずに転送する
    location /naiken/ {
        proxy_pass http://naiken_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
