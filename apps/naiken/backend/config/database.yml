# 接続情報はすべて環境変数から読み込む。
#   ローカル: apps/naiken/backend/.env            → MySQLコンテナ(db)
#   本番    : apps/naiken/backend/.env.production → Amazon RDS for MySQL
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_0900_ai_ci
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("DB_PORT") { 3306 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "naiken_user" } %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "naiken_development" } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: naiken_test

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "naiken_production" } %>
  # RDSとの通信をTLSで暗号化する。verify_identity の場合は DB_SSL_CA にRDSのCAバンドルを指定する
  ssl_mode: <%= ENV.fetch("DB_SSL_MODE") { "required" } %>
  sslca: <%= ENV["DB_SSL_CA"] %>
