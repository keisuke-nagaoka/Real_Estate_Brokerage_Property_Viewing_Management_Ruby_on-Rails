# EC2の入口のnginx(コンテナ名「nginx」、設定は ~/nginx/conf.d/)に置く設定。
# rails.keisuke-nagaoka.com への通信をHTTPSで受け、web-network 経由で naiken-nginx コンテナに転送する。
server {
    listen 80;
    server_name rails.keisuke-nagaoka.com;

    # Let's Encrypt の証明書の更新(~/renew-cert.sh)で使う
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name rails.keisuke-nagaoka.com;

    ssl_certificate /etc/letsencrypt/live/rails.keisuke-nagaoka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rails.keisuke-nagaoka.com/privkey.pem;

    # 物件写真のアップロード(1枚5MB × 最大10枚)を受け付ける(nginxの既定値は1MB)
    client_max_body_size 50m;

    # 転送先のコンテナ名は、リクエストのたびにDockerのDNS(127.0.0.11)で引く。
    # こうしておくと naiken-nginx が止まっていても入口のnginxは起動でき、node・go のサイトに影響しない
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $naiken_upstream http://naiken-nginx:80;

    location / {
        proxy_pass $naiken_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
