# 【一時的な設定】証明書を取得する前に使う(HTTPのみ)。
# Let's Encrypt の確認用ファイル(/.well-known/acme-challenge/)に応答できるようにする。
# 証明書を取得したら rails.conf に置き換える。
server {
    listen 80;
    server_name rails.keisuke-nagaoka.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
